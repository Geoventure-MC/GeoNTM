modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "@geocore.issues@"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "@geocore.homepage@"
logoFile = "assets/${mod_id}/icon.png"
authors = "${mod_author}"
description = '''${mod_description}@geocore.credits@'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_range}"
ordering = "NONE"
side = "BOTH"

# AFTER, not BEFORE — see the note in neoforge.mods.toml. `ordering` is this mod's position relative
# to the dependency, so BEFORE would construct geontm ahead of geocore and leave its mod bus unset.
[[dependencies.${mod_id}]]
modId = "geomods"
mandatory = true
versionRange = "[3.50,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geocore"
mandatory = true
versionRange = "[1.0.6,)"
ordering = "AFTER"
side = "BOTH"

# GemRender before 0.1.22 is refused (0.1.20 fixed a loading-screen hang; 0.1.22 runs upstream Flywheel on 26.1).
[[dependencies.${mod_id}]]
modId = "gemrender"
mandatory = false
versionRange = "[0.1.22,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

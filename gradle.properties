9# Root defaults. Values marked [VERSIONED] are overridden per node in
# versions/<node>/gradle.properties — a node that needs a different value MUST declare it there.

org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod.id=geontm
mod.name=GeoNTM
mod.group=fr.geoventure.geontm
mod.version=0.1.12
mod.author=Geoventure, Golem et contributeurs
mod.license=LGPL-3.0
# One short line, shown last in the mod list; every contributor is in CREDITS.txt (shipped in the jar).
mod.credits=HbMinecraft and the HBM's Nuclear Tech Mod 1.7.10 team, NTM Community Edition, NTM Reloaded, NTM NEXT
mod.homepage=https://github.com/Geoventure-MC/GeoNTM
mod.sources=https://github.com/Geoventure-MC/GeoNTM
mod.issues=https://github.com/Geoventure-MC/GeoNTM/issues
mod.description=Industrie nucléaire, satellites, missiles et radioactivité pour Geoventure.

# GeoCore, the cross-version API layer this mod is built on.
deps.geocore=1.0.6

# GeoCore's shared build layer (../GeoCore/gradle/mod/*.gradle.kts, applied by each loader buildscript).
# HBM's data for it; each script documents its parameters in its header. Lists are comma-separated.
# Dejson: the declaration classes, in initialisation order, and the reviewed list of hand-tuned authored JSON.
geocore.build.dejson.classes=gradle/dejson-classes.txt
geocore.build.dejson.authored=gradle/dejson-authored.txt
# Blender-exported animation and scene data under models/ (not models at all), so not Dejson's to own.
geocore.build.dejson.unownedFolders=assets/geontm/models/anim/,assets/geontm/models/doors/,assets/geontm/models/weapons/
# Below 1.21.4: the select properties Core's ItemModelProperties installs as legacy float predicates
# (geontm:model_state is the ModelState component; geontm:coltass and geontm:polaroid are client-state selects, the
# Coltass needle frame and the Polaroid's roll), and the minecraft:special inner types drawn by HBM's own
# item renderer (machine OBJ and the RBMK columns).
geocore.build.legacyAssets.selectProperties=geontm:model_state,geontm:coltass,geontm:polaroid,geontm:scrap_material
geocore.build.legacyAssets.selfRenderedSpecialTypes=geontm:machine_obj,geontm:rbmk_fuel_column,geontm:rbmk_block_column
# -PgunSmokeTest / -Dgeontm.gunSmokeTest reach the client run as -Dgeontm.gunSmokeTest.
geocore.build.runToolchain.clientFlags=gunSmokeTest=geontm.gunSmokeTest
# Release jars drop the GameTests, their structure files and the assets only a GameTest registers.
geocore.build.releaseJar.testPackages=fr/geoventure/geontm/gametest/
geocore.build.releaseJar.testResources=geontm/gametest/
geocore.build.releaseJar.testAssets=test_fan_blowable,test_fe_cell,test_fe_optional_cell

# [VERSIONED] Per-node values
deps.minecraft=[VERSIONED]
deps.minecraft_range=[VERSIONED]
java_version=[VERSIONED]
pack_format=[VERSIONED]

deps.fabric_loader=[VERSIONED]
deps.fabric_api=[VERSIONED]

deps.neoforge=[VERSIONED]
deps.neoforge_loader_range=[VERSIONED]

deps.forge=[VERSIONED]
deps.forge_loader_range=[VERSIONED]

# JEI: compiled against the `*-api` artifacts, and the full loader jar is added to the dev run's
# runtime classpath only — never bundled, so JEI stays an optional install-time dependency.
deps.jei_mc=[VERSIONED]
deps.jei=[VERSIONED]

# GemRender 0.1.21 (CurseForge file id): instances gem-declared machines and shades dynamic lights in dev runs.
# Optional for players; `-Pgemrender.run=false` launches without it.
deps.gemrender=[VERSIONED]
deps.gemrender_flywheel=[VERSIONED]

# Sodium: client-only dev rendering mod, added ONLY to the dev client run's runtime classpath.
# The value is the Modrinth version number. Leave empty to disable.
deps.sodium_fabric=[VERSIONED]
deps.sodium_neoforge=[VERSIONED]
# Embeddium: the Forge port of Sodium, and the only one of the family that runs on Forge 1.20.1
# (Sodium itself has no Forge build; NeoForge nodes use Sodium directly). Same rules as above —
# Modrinth version number, dev client run only, blank to disable.
deps.embeddium=[VERSIONED]

# Pipez: a third-party energy mod on the dev runtime, so the foreign-energy bridge is exercised against
# a real peer rather than only against our own facades meeting at the capability. It is the one energy
# mod published for all three forge-like nodes with no required dependencies of its own, and it spans
# all three capability eras — 26.1's transactional EnergyHandler, 1.21.1's IEnergyStorage, and 1.20.1's
# AttachCapabilitiesEvent. Modrinth version number; dev runtime only, never bundled; blank to disable,
# which also skips the gametests that drive it.
deps.pipez=[VERSIONED]

# Fabric Loom version, applied to whichever variant loom-back-compat selects for the node.
loomx.loom_version=1.16.3

# LWJGL pin. Loom force-upgrades LWJGL on old Minecraft when the Gradle JVM is Java 19+, which makes
# the dev client run a different native stack than players do. Set this to the version the target
# Minecraft actually ships to undo that; leave blank to accept Loom's choice.
deps.lwjgl=[VERSIONED]

# Release upload (../GeoCore/gradle/mod/publish.gradle.kts documents every key). A blank project id skips that
# site. Tokens come from MODRINTH_TOKEN / CURSEFORGE_TOKEN or ~/.gradle/gradle.properties, never from this file.
geocore.build.publish.modrinthProject=sr7XEjTN
geocore.build.publish.curseforgeProject=1719328
geocore.build.publish.requires=geocore,gemrender
geocore.build.publish.fabricRequires=fabric-api

# GemRender is the CurseMaven file deps.gemrender. To test an unreleased build, set gemrender.dir (the GemRender
# checkout) and gemrender.version (GeoCore's gradle/mod/gemrender-local.gradle.kts).

# Tables de recettes figées : générées une fois depuis src/recipes, puis conservées ici.
geocore.build.generatedData.generator=:1.20.1-forge:compileJava
geocore.build.generatedData.root=src/generated/data
